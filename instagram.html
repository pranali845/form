
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <link rel="stylesheet" href="insta.css">

    <!-- Instagram icon -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <div class="main-container">

        <!-- Left Section -->
        <div class="left-section">

            <i class="fa-brands fa-instagram instagram-icon"></i>

            <h1>
                See everyday moments form
                <br>
                your <span>close friends.</span>
            </h1>

            <div class="photo-container">
                <img
                    src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=600"
                    alt="Friends spending time together">
            </div>

            <p class="app-store">App Store</p>
        </div>

        <!-- Right Section -->
        <div class="right-section">

            <form id="loginForm">

                <h3>Log into Instagram</h3>

                <input
                    type="text"
                    placeholder="Mobile number, username or email"
                    required>

                <input
                    type="password"
                    placeholder="Password"
                    required>

                <button type="submit" class="login-btn">
                    Log in
                </button>

                <a href="#" class="forgot-password">
                    Forgot password?
                </a>

                <button type="button" class="facebook-btn">
                    <i class="fa-brands fa-facebook"></i>
                    Log in with Facebook
                </button>

                <button type="button" class="create-btn">
                    Create new account
                </button>

            </form>
        </div>

    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                alert("This is a demo login form.");
            });
    </script>

</body>
</html>
